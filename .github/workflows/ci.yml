name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Run Cargo test workspace
        run: cargo test -p vwi-core -p vwi-cli

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,mcp]"

      - name: Run Ruff linter
        run: |
          ruff check .

      - name: Run Pytest test suite
        run: |
          pytest -v

      - name: Build Wheel & Source Distribution
        run: |
          python -m pip install maturin
          maturin build --release

      - name: Isolated Wheel Smoke Test
        shell: bash
        run: |
          python -m pip install --force-reinstall target/wheels/*.whl
          mkdir -p /tmp/smoke_test || mkdir -p ./smoke_test
          cd /tmp/smoke_test 2>/dev/null || cd ./smoke_test
          vn-intel --help
