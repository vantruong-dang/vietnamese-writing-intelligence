[workspace]
members = [
    "crates/vwi-core",
    "crates/vwi-py",
    "crates/vwi-cli",
]
resolver = "2"

[workspace.package]
version = "0.3.1"
edition = "2021"
authors = ["Van-Truong Dang <vantruong-dang@users.noreply.github.com>"]
license = "MIT"
repository = "https://github.com/vantruong-dang/vietnamese-writing-intelligence"
homepage = "https://github.com/vantruong-dang/vietnamese-writing-intelligence"
readme = "README.md"
keywords = ["vietnamese", "nlp", "tokenization", "viterbi", "linter"]
categories = ["text-processing", "command-line-utilities"]
