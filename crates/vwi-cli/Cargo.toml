[package]
name = "vwi-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "High-performance standalone native CLI for Vietnamese Writing Intelligence"

[[bin]]
name = "vwi"
path = "src/main.rs"

[dependencies]
vwi-core = { path = "../vwi-core" }
clap = { version = "4.5", features = ["derive", "cargo"] }
colored = "2.1"
serde_json = "1.0"
anyhow = "1.0"
