[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vietnamese-writing-intelligence"
version = "0.2.1"
description = "An agentic framework for native Vietnamese writing, voice profiling, and fact-preserving text refinement."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Van-Truong Dang", email = "vantruong-dang@users.noreply.github.com" }
]
keywords = ["vietnamese", "nlp", "llm", "agent-skills", "writing", "humanizer", "mcp"]
dependencies = [
    "jsonschema>=4.20.0",
    "vietnamese-writing-skills>=0.4.6,<0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]
mcp = [
    "mcp>=1.1.0",
]

[project.scripts]
vn-intel = "vn_writing_intel.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vn_writing_intel"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "vn_writing_intel/schemas"
"tests/data/linguistic_gold_standard.jsonl" = "vn_writing_intel/data/linguistic_gold_standard.jsonl"
"tests/data/real_world_benchmark.jsonl" = "vn_writing_intel/data/real_world_benchmark.jsonl"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "BLE001",  # Cho phép CLI bắt Exception cấp cao để in thông báo thân thiện
    "E501",    # Cho phép chuỗi văn bản tiếng Việt / regex dài trong dữ liệu và luật
    "RUF001",  # Cho phép dấu nháy đơn cong (‘ ’) trong module chuẩn hóa dấu câu tiếng Việt
]

[tool.ruff.lint.isort]
combine-as-imports = true
