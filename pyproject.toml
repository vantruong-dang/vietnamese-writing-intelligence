[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[project]
name = "vietnamese-writing-intelligence"
version = "0.3.1"
description = "High-performance Vietnamese functional grammar linter, style auditor, and 100% offline WebAssembly checker."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Van-Truong Dang", email = "vantruong-dang@users.noreply.github.com" }
]
keywords = ["vietnamese", "linter", "grammar-checker", "functional-grammar", "viterbi", "rust", "webassembly", "mcp"]
dependencies = [
    "jsonschema>=4.20.0",
    "vietnamese-writing-skills>=0.4.6,<0.6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "build>=1.0.0",
]
mcp = [
    "mcp>=1.1.0",
]
nlp = [
    "underthesea>=6.8.0",
]
drafting = [
    "anthropic>=0.18.0",
    "openai>=1.12.0",
    "google-genai>=1.0.0",
]

[project.scripts]
vn-intel = "vn_writing_intel.cli:main"

[tool.maturin]
python-source = "src"
manifest-path = "crates/vwi-py/Cargo.toml"
module-name = "vn_writing_intel._core"
features = ["pyo3/extension-module"]
include = [
    { path = "schemas/**/*", format = ["wheel", "sdist"] },
    { path = "tests/data/*.jsonl", format = ["wheel", "sdist"] },
]

[tool.pytest.ini_options]
# `scripts/` chứa test E2E thủ công (playwright, binary Windows), không chạy CI.
testpaths = ["tests"]
norecursedirs = ["scripts", ".venv", "target", "dist", "extensions", "data_raw", "data_processed"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "RUF"]
ignore = [
    "BLE001",  # Cho phép CLI bắt Exception cấp cao để in thông báo thân thiện
    "E501",    # Cho phép chuỗi văn bản tiếng Việt / regex dài trong dữ liệu và luật
    "RUF001",  # Cho phép dấu nháy đơn cong (‘ ’) trong module chuẩn hóa dấu câu tiếng Việt
]

[tool.ruff.lint.isort]
combine-as-imports = true

[dependency-groups]
dev = [
    "beautifulsoup4>=4.15.0",
    "feedparser>=6.0.14",
    "requests>=2.34.2",
    "trafilatura>=2.3.1",
]
